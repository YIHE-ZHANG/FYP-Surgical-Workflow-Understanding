pretrain:  './models/vit-16-32f.pt'
resume:
seed: 1024
data:
    dataset: rarp50
    modality: RGB
    num_frames: 16
    ds: 4  # Reduced from 16 to capture finer-grained movements
    ol: 0.75  # Increased overlap for better continuous action coverage
    seg_length: 1
    n_split: 1
    split: 2
    batch_size: 4
    workers: 4
    gpus: 4
    num_classes: 8
    index_bias: 0
    input_size: 224
    max_act: 8
    randaug:  # Increased augmentation to help with class imbalance
        N: 0  # Use 2 random augmentations
        M: 9  # Intensity of augmentations
network:
    arch: ViT-B/16
    init: True
    drop_out: 0.1  # Added dropout for better generalization
    emb_dropout: 0.1  # Added embedding dropout
    partial_bn: False
    version: ''
    bn_momentum: 0.1
    consensus_type: avg
    type: clip_surgery
    sim_header: 'Transf'
    fix_text: False
    fix_img: False
    describe:
solver:
    type: cosine
    epochs: 10  # Increased from 50 to allow more training time
    start_epoch: 0
    epoch_offset: 0
    optim: adamw
    lr: 1.e-5  # Increased from 5.e-6 for faster convergence
    lr_warmup_step: 10  # Increased warmup steps
    momentum: 0.9
    weight_decay: 0.1  # Reduced from 0.2 to prevent overfitting
    lr_decay_step: 15
    lr_decay_factor: 0.1
    clip_gradient: 20
    loss_type: nll
    evaluate: False
    ratio: 1
    f_ratio: 10
    class_weights: True  # Added class weighting for imbalanced classes